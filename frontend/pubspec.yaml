name: school_bus
description: "학원 통학버스 통합관리 - 기사/관리자 클라이언트. 설계는 docs/FLUTTER_FRONTEND_PLAN.md 참조."
publish_to: 'none'
version: 0.1.0+1

environment:
  # flutter create 기본값은 로컬 SDK 와 똑같은 ^3.12.2 였지만, Docker 빌드 이미지
  # (ghcr.io/cirruslabs/flutter:stable)의 Dart 가 3.12.0 이라 pub get 이 실패했다.
  # 그 레지스트리엔 버전 태그가 없어 이미지를 고정할 수 없으므로 하한을 낮춰 맞춘다.
  # 상한(<4.0.0)은 그대로라 안전하다.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 상태관리. riverpod_annotation(코드생성)은 쓰지 않는다 —
  # riverpod_generator 가 Flutter 3.44.8 번들 analyzer 와 버전 충돌한다(2026-07-28 확인).
  # Provider 는 손으로 선언한다.
  flutter_riverpod: ^3.4.1

  # 라우팅 — redirect 훅으로 역할별 진입 분기/미로그인 차단을 한 곳에서 처리
  go_router: ^17.3.0

  # HTTP — interceptor 로 JWT 부착 + 401 자동 refresh 를 한 군데로 모은다
  dio: ^5.11.0

  # 모델/직렬화 — ApiResponse<T> 제네릭 언랩을 타입 안전하게
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 토큰 보관 — 모바일 Keychain/Keystore, 웹은 WebCrypto 로 자동 분기
  flutter_secure_storage: ^10.3.1

  # 실시간 — 백엔드가 SockJS 미사용 순수 STOMP 라 그대로 맞는다(MVP_API_SPEC §7.1)
  stomp_dart_client: ^3.0.1

  # 지도 — flutter_naver_map 은 Web 미지원이라 채택 불가(계획서 §1.3).
  # 노선 polyline + 마커만 그리면 되므로 OSM 타일로 충분하다.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # 기사 위치 보고의 실GPS 소스(Mock 과 토글, 계획서 §8 D2)
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # DTO 생성 전용 — 코드 수정 후 `dart run build_runner build --delete-conflicting-outputs`
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
