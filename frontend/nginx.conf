server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — go_router 딥링크(/admin/routes 등)에서 새로고침하면 nginx 가 그 경로의
    # 실제 파일을 찾다가 404 를 낸다. 없는 경로는 전부 index.html 로 넘겨 라우팅을 Flutter 에 맡긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ Flutter Web 산출물에는 **파일명 해시가 없다.** main.dart.js 는 빌드할 때마다
    # 내용이 바뀌어도 이름이 그대로다. 여기에 immutable 을 걸면 브라우저가 새로고침해도
    # 재요청하지 않아 **배포해도 옛 화면이 계속 보인다**(실제로 겪음 — 자리표시자 화면이
    # 사라지지 않는 것처럼 보였다).
    #
    # 그래서 진입점 스크립트·index.html 은 매번 검증하게 한다. no-cache 는 "캐시하지 마라"가
    # 아니라 "쓰기 전에 서버에 물어보라"는 뜻이라, 내용이 그대로면 304 로 끝나 비용도 작다.
    location ~* ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache" always;
    }

    # canvaskit 은 버전이 경로에 박혀 있어 안전하게 길게 캐시할 수 있다.
    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # 나머지 정적 자산(폰트·이미지)은 짧게 캐시하고 검증하게 둔다 —
    # 이것들도 이름이 안 바뀌므로 immutable 은 위험하다.
    location ~* \.(?:css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
