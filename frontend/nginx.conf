server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — go_router 딥링크(/admin/routes 등)에서 새로고침하면 nginx 가 그 경로의
    # 실제 파일을 찾다가 404 를 낸다. 없는 경로는 전부 index.html 로 넘겨 라우팅을 Flutter 에 맡긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 산출물은 길게 캐시, index.html 은 캐시하지 않는다
    # (index.html 이 캐시되면 배포 후에도 옛 번들을 계속 가리킨다).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
